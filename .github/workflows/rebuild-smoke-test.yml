name: APK Rebuild Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check APK exists and is a valid ZIP container
        shell: bash
        run: |
          set -euo pipefail
          test -s app.apk
          ls -lh app.apk
          file app.apk
          unzip -t app.apk

      - name: Install Android build tools and Apktool
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apktool zip unzip
          echo "y" | sdkmanager --licenses
          sdkmanager "platform-tools" "build-tools;35.0.0"

      - name: Decode APK
        shell: bash
        run: |
          set -euo pipefail
          apktool d app.apk -o decoded --force

      - name: Rebuild decoded APK
        shell: bash
        run: |
          set -euo pipefail
          apktool b decoded -o rebuilt-unsigned.apk

      - name: Align, sign, and verify rebuilt APK
        shell: bash
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME}/build-tools/35.0.0"
          keytool -genkeypair \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          "${BT}/zipalign" -f -p 4 rebuilt-unsigned.apk rebuilt-aligned.apk
          "${BT}/apksigner" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out rebuilt-signed.apk \
            rebuilt-aligned.apk
          "${BT}/apksigner" verify --verbose rebuilt-signed.apk
          ls -lh app.apk rebuilt-signed.apk

      - name: Upload smoke-test output and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-rebuild-smoke-test
          path: |
            app.apk
            rebuilt-unsigned.apk
            rebuilt-aligned.apk
            rebuilt-signed.apk
          if-no-files-found: warn
          retention-days: 7

