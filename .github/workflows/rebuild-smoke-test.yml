name: APK Rebuild Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -s app.apk
          ls -lh app.apk
          file app.apk
          unzip -t app.apk

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Do not use android-actions/setup-android here: in this environment
      # it attempts to install the obsolete SDK package named "tools".
      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apktool zip unzip
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          test -n "${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" --install "platform-tools" "build-tools;35.0.0"
          echo "${SDK_ROOT}/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          command -v apktool
          test -x "${SDK_ROOT}/build-tools/35.0.0/apksigner"
          test -x "${SDK_ROOT}/build-tools/35.0.0/zipalign"

      - name: Decode APK
        shell: bash
        run: |
          set -euo pipefail
          apktool d app.apk -o decoded --force

      - name: Rebuild decoded APK
        shell: bash
        run: |
          set -euo pipefail
          apktool b decoded -o rebuilt-unsigned.apk

      - name: Align, sign, and verify rebuilt APK
        shell: bash
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME}/build-tools/35.0.0"
          keytool -genkeypair \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          "${BT}/zipalign" -f -p 4 rebuilt-unsigned.apk rebuilt-aligned.apk
          "${BT}/apksigner" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out rebuilt-signed.apk \
            rebuilt-aligned.apk
          "${BT}/apksigner" verify --verbose rebuilt-signed.apk
          ls -lh app.apk rebuilt-signed.apk

      - name: Upload smoke-test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-rebuild-smoke-test
          path: |
            app.apk
            rebuilt-unsigned.apk
            rebuilt-aligned.apk
            rebuilt-signed.apk
          if-no-files-found: warn
          retention-days: 7
